<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_HELP / ASSIST" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_HELP / ASSIST" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_HELP / ASSIST" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_HELP / ASSIST)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="95" y="32" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_HELP / ASSIST)">
    
          <circle cx="0" cy="0" r="54" fill="#EF4444" fill-opacity="0.1"/>
          <!-- Base Palm -->
          <rect x="-42" y="15" width="84" height="12" rx="6" fill="#64748B" stroke="#F8FAFC" stroke-width="1.5"/>
          <!-- Supported Hand (Fist with thumb up) -->
          <rect x="-18" y="-20" width="36" height="34" rx="8" fill="url(#primary_help)" stroke="#F8FAFC" stroke-width="2"/>
          <path d="M-2 -20 L-2 -38 A6 6 0 0 1 8 -38 L8 -20" fill="url(#primary_help)" stroke="#F8FAFC" stroke-width="1.5"/>
          <!-- Upward Lift Arrows -->
          <path d="M-30 -5 L-30 -25 M-30 -25 L-36 -18 M-30 -25 L-24 -18" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M30 -5 L30 -25 M30 -25 L24 -18 M30 -25 L36 -18" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Left palm lifts upward, supporting right hand
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    HELP / ASSIST
  </text>
  <text x="200" y="302" fill="#EF4444" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    मदत <tspan fill="#64748B" font-size="14" font-weight="500">[Madat]</tspan>
  </text>
</svg>