<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_HOME / HOUSE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_HOME / HOUSE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_HOME / HOUSE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_HOME / HOUSE)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
  <text x="95" y="32" fill="#F97316" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_HOME / HOUSE)">
    
          <circle cx="0" cy="0" r="54" fill="#F97316" fill-opacity="0.1"/>
          <!-- House Roof Hands -->
          <path d="M-38 15 L0 -28 L38 15" fill="none" stroke="url(#primary_home)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="-28" y1="28" x2="28" y2="28" stroke="#F8FAFC" stroke-width="2"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Fingertips meet at angle to form roof of a house
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    HOME / HOUSE
  </text>
  <text x="200" y="302" fill="#F97316" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    घर <tspan fill="#64748B" font-size="14" font-weight="500">[Ghar]</tspan>
  </text>
</svg>