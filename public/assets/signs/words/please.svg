<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_PLEASE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_PLEASE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_PLEASE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A855F7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_PLEASE)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#A855F7" fill-opacity="0.15" stroke="#A855F7" stroke-width="1"/>
  <text x="95" y="32" fill="#A855F7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_PLEASE)">
    
          <circle cx="0" cy="0" r="54" fill="#A855F7" fill-opacity="0.1"/>
          <!-- Chest Hand -->
          <circle cx="0" cy="0" r="28" fill="url(#primary_please)" stroke="#F8FAFC" stroke-width="2"/>
          <!-- Circular Clockwise Arrow -->
          <path d="M0 -40 A40 40 0 1 1 -38 10" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="-38,0 -42,12 -30,10" fill="#C084FC"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Flat hand circular motion over heart / chest
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    PLEASE
  </text>
  <text x="200" y="302" fill="#A855F7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    कृपया <tspan fill="#64748B" font-size="14" font-weight="500">[Krupaya]</tspan>
  </text>
</svg>