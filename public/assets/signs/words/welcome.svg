<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_WELCOME" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_WELCOME" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_WELCOME" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14B8A6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_WELCOME)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="95" y="32" fill="#14B8A6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_WELCOME)">
    
          <circle cx="0" cy="0" r="54" fill="#14B8A6" fill-opacity="0.1"/>
          <!-- Dual Open Hands Sweeping -->
          <path d="M-32 20 Q-35 -15 -15 -25 Q0 -15 -8 20" fill="url(#primary_welcome)" stroke="#F8FAFC" stroke-width="1.5"/>
          <path d="M32 20 Q35 -15 15 -25 Q0 -15 8 20" fill="url(#primary_welcome)" stroke="#F8FAFC" stroke-width="1.5"/>
          <path d="M-25 32 Q0 15 25 32" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="3,3"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Open palms extended forward sweeping inward
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    WELCOME
  </text>
  <text x="200" y="302" fill="#14B8A6" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    स्वागत <tspan fill="#64748B" font-size="14" font-weight="500">[Swaagat]</tspan>
  </text>
</svg>