<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_TEA / CHAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_TEA / CHAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_TEA / CHAI" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_TEA / CHAI)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="1"/>
  <text x="95" y="32" fill="#D97706" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_TEA / CHAI)">
    
          <circle cx="0" cy="0" r="54" fill="#D97706" fill-opacity="0.1"/>
          <!-- Tea Cup -->
          <path d="M-22 -8 L-18 25 Q0 30 18 25 L22 -8 Z" fill="url(#primary_tea)" stroke="#F8FAFC" stroke-width="2"/>
          <!-- Handle -->
          <path d="M20 -2 Q34 6 20 18" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
          <!-- Steam Lines -->
          <path d="M-8 -15 Q-12 -28 -6 -36" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 -15 Q4 -28 10 -36" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Holding small tea cup and sipping gesture
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    TEA / CHAI
  </text>
  <text x="200" y="302" fill="#D97706" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    चहा <tspan fill="#64748B" font-size="14" font-weight="500">[Chaha]</tspan>
  </text>
</svg>