<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_WATER" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_WATER" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_WATER" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_WATER)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="1"/>
  <text x="95" y="32" fill="#0284C7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_WATER)">
    
          <circle cx="0" cy="0" r="54" fill="#0284C7" fill-opacity="0.1"/>
          <!-- Drinking Cup Hand -->
          <path d="M-28 -15 Q-30 25 0 28 Q30 25 28 -15 Z" fill="url(#primary_water)" stroke="#F8FAFC" stroke-width="2"/>
          <!-- Water Ripple / Droplets -->
          <circle cx="0" cy="-2" r="14" fill="#38BDF8" fill-opacity="0.4"/>
          <path d="M0 -36 C-8 -22 8 -22 0 -36 Z" fill="#38BDF8"/>
          <!-- Curved Motion Arc to mouth -->
          <path d="M34 10 A25 25 0 0 0 25 -25" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,3"/>
          <polygon points="20,-28 28,-25 24,-17" fill="#38BDF8"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Cupped hand brought to mouth in drinking motion
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    WATER
  </text>
  <text x="200" y="302" fill="#0284C7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    पाणी <tspan fill="#64748B" font-size="14" font-weight="500">[Paani]</tspan>
  </text>
</svg>