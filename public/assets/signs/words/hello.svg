<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_HELLO / NAMASTE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_HELLO / NAMASTE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_HELLO / NAMASTE" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_HELLO / NAMASTE)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="32" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_HELLO / NAMASTE)">
    
          <circle cx="0" cy="0" r="54" fill="#10B981" fill-opacity="0.1"/>
          <!-- Prayer Hands / Anjali Mudra -->
          <path d="M-14 30 C-14 10 -6 -25 0 -40 C6 -25 14 10 14 30 Z" fill="url(#primary_hello)" stroke="#F8FAFC" stroke-width="2"/>
          <path d="M-8 30 C-8 15 -2 -15 0 -38 C2 -15 8 15 8 30" fill="none" stroke="#F8FAFC" stroke-width="1.5"/>
          <!-- Radiating Greeting Arcs -->
          <path d="M-36 -10 A40 40 0 0 1 -36 -40" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M36 -10 A40 40 0 0 0 36 -40" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Both palms pressed together at chest (Anjali Mudra)
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    HELLO / NAMASTE
  </text>
  <text x="200" y="302" fill="#10B981" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    नमस्कार <tspan fill="#64748B" font-size="14" font-weight="500">[Namaskar]</tspan>
  </text>
</svg>