<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_SCHOOL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="primary_SCHOOL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow_SCHOOL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="396" height="336" x="2" y="2" rx="16" fill="url(#bg_SCHOOL)" stroke="#334155" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="20" y="16" width="150" height="24" rx="12" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
  <text x="95" y="32" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ISL WORD SIGN</text>

  <!-- Central Visual Area -->
  <g transform="translate(200, 125)" filter="url(#glow_SCHOOL)">
    
          <circle cx="0" cy="0" r="54" fill="#F59E0B" fill-opacity="0.1"/>
          <!-- Two Clapping Hands -->
          <path d="M-28 20 L-6 -22 A8 8 0 0 1 8 -22 L30 20 Z" fill="url(#primary_school)" stroke="#F8FAFC" stroke-width="2"/>
          <line x1="-20" y1="20" x2="22" y2="20" stroke="#F8FAFC" stroke-width="3"/>
          <!-- Clapping burst lines -->
          <line x1="-36" y1="-10" x2="-22" y2="-5" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="36" y1="-10" x2="22" y2="-5" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
        
  </g>

  <!-- Movement Guide / Gesture Hint -->
  <rect x="50" y="210" width="300" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="228" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Motion: Open hands clap horizontally twice
  </text>

  <!-- Word Gloss & Translations -->
  <text x="200" y="272" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    SCHOOL
  </text>
  <text x="200" y="302" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    शाळा <tspan fill="#64748B" font-size="14" font-weight="500">[Shaala]</tspan>
  </text>
</svg>